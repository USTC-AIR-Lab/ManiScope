meta:
  episodes: 50
  task_config: demo_clean
  instruction_type: unseen
  smoke_threshold: Historical expert feasibility screening; frozen seeds are bundled.
  formal_scenes: 48
  formal_note: 'ManipScope formal48-v1: frozen 48-scene membership. Historical scene
    changes are not silently included.'
tiers:
  L1: 单点替换 —— 克隆一个训练任务只动一个变量，干扰物 0-1 个，单段动作
  L2: 一跳 + 干扰 —— 一个新变量 + 只差一个属性的干扰物，或两段动作
  L3: 双约束 / 双段 —— 两个约束同时成立，或两段动作有真实先后依赖
  L4: 复合深度 —— 三个及以上约束，或需要重复执行 / 多目标分派
