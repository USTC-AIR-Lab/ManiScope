skill_x_scene:
  desc: 同一场景在分布偏移下（随机背景/光照/桌高，关掉杂乱物）。不新增场景，只换 task_config。
  task_config: _rand_noclutter
  note: 必须用 _rand_noclutter 而不是 demo_randomized：杂乱桌面撒的干扰物沉降不稳会抛 UnStableError，且发生在种子被接受**之后**的
    setup_demo(is_test=True)，不在 eval_policy 的 try 覆盖内，会直接打断整轮。
  anchors:
  - move_cup_pad
  - attr_bind_bottle
  - ref_block_on_plate
  - place_a2b_left_novel
  - stapler_pad_press
  - ref_second_from_left
excluded_low_expert_yield:
  reason: 脚本专家产出率 < 30%（用户设定门槛），种子集会被筛成极窄子集、成绩没有代表性；非因分数低而排除。诊断：place_actor 在这几种几何下规划静默失败。
  measured:
    place_a2b_behind_novel: 4/26 ~ 15%
    attr_color_bottle_basket: 4/26 ~ 15%
    ref_cube_on_plate_to_pad: 3/26 ~ 12%
  scenes:
  - attr_color_bottle_basket
  - place_a2b_behind_novel
  - ref_cube_on_plate_to_pad
  status: 配置文件已于 2026-09-16 删除（envs/description/task_config/table.py），仅保留此记录说明排除原因。
