policies:
  dm05:
    hf_repo: https://huggingface.co/Dexmal/DM05-robotwin2
    code_repo: https://github.com/dexmal/opendm
    desc: DM05 RoboTwin policy backend; consult the linked upstream model documentation.
    policy_name: DM05
    ckpt_setting: dm05
    server: http
    port: 7891
    launch: suite/launch/start_dm05.sh
    launch_note: opendm backend; configure DM05_MODEL and use sdpa attention when
      flash_attn is unavailable. Check nested checkpoint vision_config as well as
      command-line flags.
    required_env:
    - DM05_MODEL
    - OPENDM_DIR
    - OPENDM_ENV
  pi05:
    hf_repo: https://huggingface.co/motus-robotics/pi0.5_robotwin2
    code_repo: https://github.com/Physical-Intelligence/openpi
    desc: Pi05 RoboTwin policy backend; consult the linked upstream model documentation.
    policy_name: Pi05
    ckpt_setting: pi05
    server: http
    port: 7893
    launch: suite/launch/start_pi05.sh
    launch_note: openpi PyTorch with transformers==4.53.2 and its transformers_replace
      patch. pi05=True; action_horizon=32; adapt_to_pi=True; use_delta_joint_actions=True.
      Serve absolute joints in one thread to preserve CUDA graph affinity.
    required_env:
    - OPENPI
    - PI05_CKPT
  xvla:
    hf_repo: https://huggingface.co/2toINF/X-VLA-RoboTwin2
    code_repo: https://github.com/2toINF/X-VLA
    desc: XVLA RoboTwin policy backend; consult the linked upstream model documentation.
    policy_name: XVLA
    ckpt_setting: xvla
    server: http
    port: 7960
    launch: suite/launch/start_xvla.sh
    launch_note: Decode ee6d to 16-dimensional end-effector poses and execute through
      cuRobo, domain_id=6. Step limits count take_action calls; one EEF call may execute
      a planned trajectory.
    required_env:
    - XVLA_CKPT
    - XVLA_DIR
  pi0:
    hf_repo: https://huggingface.co/yuffish/robotwin-pi0_aloha-agilex_clean-50
    code_repo: https://github.com/Physical-Intelligence/openpi
    desc: Pi0 RoboTwin policy backend; consult the linked upstream model documentation.
    policy_name: Pi0
    ckpt_setting: pi0
    server: http
    port: 7894
    launch: suite/launch/start_pi0.sh
    launch_note: openpi JAX; disable XLA preallocation. adapt_to_pi=True and use_delta_joint_actions=True
      follow LeRobotAlohaDataConfig. Check checkpoint conventions before evaluation.
    required_env:
    - OPENPI
    - PI0_CKPT
  wla_formal:
    desc: WLAFormal RoboTwin policy backend; consult the linked upstream model documentation.
    hf_repo: https://huggingface.co/SJTU-DENG-Lab/wla_robotwin_all_image_action
    code_repo: https://github.com/SJTU-DENG-Lab/WLA
    policy_name: WLAFormal
    ckpt_setting: wla_formal
    server: http
    port: 7980
    launch: suite/launch/start_wla_formal.sh
    launch_note: 'Four 256-pixel views: previous head, current head, left and right,
      resized with padding. Previous head comes from index len-8-1 of the preceding
      chunk. Use official normalization, chunk 32, bf16 backbone and fp32 action expert;
      released checkpoint uses EEF control.'
    required_env:
    - WLA_MODEL_ID
    - WLA_ROOT
  starvla:
    desc: StarVLA RoboTwin policy backend; consult the linked upstream model documentation.
    hf_repo: https://huggingface.co/StarVLA/Qwen3-VL-OFT-RoboTwin2-All
    code_repo: https://github.com/starVLA/starVLA
    policy_name: StarVLA
    ckpt_setting: starvla
    server: http
    port: 7970
    launch: suite/launch/start_starvla.sh
    launch_note: Official websocket service on PORT+100 and HTTP bridge on PORT. 224-pixel
      INTER_AREA resize; unnorm_key=new_embodiment; DDIM 10; joint reorder [0..5,12,6..11,13].
    required_env:
    - STARVLA_CKPT
    - STARVLA_DIR
  fastwam:
    desc: FastWAM RoboTwin policy backend; consult the linked upstream model documentation.
    hf_repo: https://huggingface.co/yuanty/fastwam
    code_repo: https://github.com/yuantianyuan01/FastWAM
    policy_name: FastWAM
    ckpt_setting: fastwam
    server: http
    port: 7995
    launch: suite/launch/start_fastwam.sh
    launch_note: Wan2.2 VAE/T5/tokenizer sidecars under DIFFSYNTH_MODEL_BASE_PATH.
      num_inference_steps=10; replan_steps=24; text_cfg_scale=1.0. Absolute joint
      actions.
    required_env:
    - DIFFSYNTH_MODEL_BASE_PATH
    - FASTWAM_CKPT
    - FASTWAM_ROOT
    - FASTWAM_STATS
  ahawam:
    desc: AHAWAM RoboTwin policy backend; consult the linked upstream model documentation.
    hf_repo: https://huggingface.co/SereneC/AHA-WAM-RoboTwin2.0（robotwin_ahawam.pt
      + dataset_stats.json）
    code_repo: https://github.com/serene-sivy/AHA-WAM
    policy_name: AHAWAM
    ckpt_setting: ahawam
    server: http
    port: 7996
    launch: suite/launch/start_ahawam.sh
    launch_note: Wan2.2 sidecars; num_inference_steps=10; chunks_per_video_prefill=2;
      text_cfg_scale=1.0. Keep one policy instance to retain history; execute all
      16 actions before the next refill.
    required_env:
    - AHAWAM_CKPT
    - AHAWAM_ROOT
    - AHAWAM_STATS
    - DIFFSYNTH_MODEL_BASE_PATH
  xwam:
    desc: XWAM RoboTwin policy backend; consult the linked upstream model documentation.
    hf_repo: https://huggingface.co/sharinka0715/X-WAM-checkpoints（robotwin_sft）
    code_repo: https://github.com/sharinka0715/X-WAM
    policy_name: XWAM
    ckpt_setting: xwam
    server: http
    port: 7997
    launch: suite/launch/start_xwam.sh
    launch_note: Wan2.2 sidecars; DiT weights from last.ckpt after from_config. denoise_steps=50;
      action_denoise_steps=10; cfg=0; action_length=32. EEF control.
    required_env:
    - TOKENIZERS_PARALLELISM
    - XWAM_EXP
    - XWAM_ROOT
    - XWAM_WAN_DIR
  g05:
    desc: G05 RoboTwin policy backend; consult the linked upstream model documentation.
    hf_repo: https://huggingface.co/OpenGalaxea/G05（g05-robotwin20/ + action_tokenizer.pt
      + qwen3_5_2b_base_processor/，gated）
    code_repo: https://github.com/OpenGalaxea/GalaxeaVLA
    policy_name: G05
    ckpt_setting: g05
    server: http
    port: 7999
    launch: suite/launch/start_g05.sh
    launch_note: Official checkpoint layout; action_horizon=32, replan_steps=8; absolute
      joint actions. See launcher for processor and tokenizer paths.
    required_env:
    - G05_ROOT
  openwam:
    desc: OpenWAM RoboTwin policy backend; consult the linked upstream model documentation.
    hf_repo: https://huggingface.co/OpenWAM/OpenWAM-Alpha-Sim-RoboTwin-Full
    code_repo: https://github.com/OpenWAM-Official/OpenWAM
    policy_name: OpenWAM
    ckpt_setting: openwam
    server: http
    port: 7998
    launch: suite/launch/start_openwam.sh
    launch_note: Unified checkpoint supplies VAE/T5/tokenizer. EEF adapter converts
      20-dimensional rotation-6D actions to 16-dimensional poses; server manages chunks.
    required_env:
    - OPENWAM_CKPT
    - OPENWAM_DIR
  motus:
    desc: Motus RoboTwin policy backend; consult the linked upstream model documentation.
    hf_repo: https://huggingface.co/motus-robotics/Motus_robotwin2
    code_repo: https://github.com/thu-ml/Motus
    policy_name: Motus
    ckpt_setting: motus
    server: http
    port: 8000
    launch: suite/launch/start_motus.sh
    launch_note: Wan2.2 sidecars and Qwen3-VL-2B-Instruct processor; 10 denoising
      steps. Execute the complete predicted absolute-joint chunk.
    required_env:
    - MOTUS_CKPT
    - MOTUS_ROOT
    - MOTUS_VLM
    - MOTUS_WAN
  lingbot_va:
    desc: LingBotVA RoboTwin policy backend; consult the linked upstream model documentation.
    hf_repo: https://huggingface.co/robbyant/lingbot-va-posttrain-robotwin
    code_repo: https://github.com/Robbyant/lingbot-va
    policy_name: LingBotVA
    ckpt_setting: lingbot_va
    server: http
    port: 8001
    launch: suite/launch/start_lingbot_va.sh
    launch_note: Official reset/infer/kv protocol; video_guidance_scale=5, action_guidance_scale=1,
      va_robotwin_cfg with 25 video/50 action denoising steps. Relative-initial-pose
      EEF actions.
    required_env:
    - LB_CKPT
    - LB_DIR
  eef_bridge:
    desc: Optional API-driven EEF agent with a bundled bridge; supply private provider credentials.
    policy_name: GPT6
    ckpt_setting: eef_bridge
    server: http
    port: 18770
    launch: ''
    external_only: true
    launch_note: AUTO_LAUNCH=0; see docs/EXTERNAL_AGENT.md.
planned_policies:
  eventvla:
    desc: EventVLA RoboTwin-MeM checkpoint; integration pending, not a measured baseline.
    hf_repo: https://huggingface.co/ganlinyang/EventVLA
    code_repo: https://github.com/InternRobotics/EventVLA
    status: integration pending
