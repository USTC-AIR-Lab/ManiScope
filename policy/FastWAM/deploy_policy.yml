# FastWAM (yuanty/fastwam, robotwin_uncond_3cam_384) 单内核 eval 基础字段。
# 场景/episode 数由 run_suite.sh 通过 --overrides 覆盖，这里只放策略协议字段。
policy_name: FastWAM
task_name: null
task_config: demo_clean
ckpt_setting: fastwam
seed: 0
instruction_type: unseen

# 推理服务（openpi pytorch 起，见 suite/launch/start_fastwam.sh）
base_url: http://localhost:7995
cameras: "head_camera_rgb,left_camera_rgb,right_camera_rgb"
# 官方 replan_steps=24：服务回 32 步，内核只执行前 24 步再重推（与官方等价）
action_horizon: 24
api_style: v1
# pi0.5 输出绝对 qpos
action_mode: absolute
