# Motus (motus-robotics/Motus_robotwin2, thu-ml/Motus) 单内核 eval 基础字段。
# 场景/episode 数由 run_suite.sh 通过 --overrides 覆盖，这里只放策略协议字段。
policy_name: Motus
task_name: null
task_config: demo_clean
ckpt_setting: motus
seed: 0
instruction_type: unseen

# 推理服务（见 suite/launch/start_motus.sh）
base_url: http://localhost:8000
cameras: "head_camera_rgb,left_camera_rgb,right_camera_rgb"
# 官方 eval(): 每次推理把整段预测动作全部执行完再重推（不截断）；0 = 不截断
action_horizon: 0
api_style: v1
# 绝对 qpos（14 维）
action_mode: absolute
