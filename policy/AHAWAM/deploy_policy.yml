# AHA-WAM (SereneC/AHA-WAM-RoboTwin2.0, robotwin_ahawam) 单内核 eval 基础字段。
# 场景/episode 数由 run_suite.sh 通过 --overrides 覆盖，这里只放策略协议字段。
policy_name: AHAWAM
task_name: null
task_config: demo_clean
ckpt_setting: ahawam
seed: 0
instruction_type: unseen

# 推理服务（见 suite/launch/start_ahawam.sh）
base_url: http://localhost:7996
cameras: "head_camera_rgb,left_camera_rgb,right_camera_rgb"
# 官方 step(): 动作队列空时才取新观测并推一个 action_chunk_size=16 的 chunk；服务每次回 16 步，内核执行完再重推（等价）
action_horizon: 16
api_style: v1
# 绝对 qpos
action_mode: absolute
