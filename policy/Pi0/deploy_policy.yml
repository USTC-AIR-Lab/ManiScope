# pi0 (yuffish/robotwin-pi0_aloha-agilex_clean-50, openpi JAX) 单内核 eval 基础字段。
# 场景/episode 数由 run_suite.sh 通过 --overrides 覆盖，这里只放策略协议字段。
policy_name: Pi0
task_name: null
task_config: demo_clean
ckpt_setting: pi0
seed: 0
instruction_type: unseen

# 推理服务（openpi pytorch 起，见 suite/launch/start_pi0.sh）
base_url: http://localhost:7894
cameras: "head_camera_rgb,left_camera_rgb,right_camera_rgb"
# pi0 的 action_horizon 是 50（openpi 默认）
action_horizon: 50
api_style: v1
# pi0.5 输出绝对 qpos
action_mode: absolute
