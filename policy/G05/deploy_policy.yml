# GalaxeaVLA G0.5 (OpenGalaxea/G05, g05-robotwin20) 单内核 eval 基础字段。
# 场景/episode 数由 run_suite.sh 通过 --overrides 覆盖，这里只放策略协议字段。
policy_name: G05
task_name: null
task_config: demo_clean
ckpt_setting: g05
seed: 0
instruction_type: unseen

# 推理服务（见 suite/launch/start_g05.sh）
base_url: http://localhost:7999
cameras: "head_camera_rgb,left_camera_rgb,right_camera_rgb"
# 官方 deploy_policy.yml: replan_steps=8 —— 服务回整段 chunk，内核只执行前 8 步再重推（等价）
action_horizon: 8
api_style: v1
# 绝对 qpos（14 维）
action_mode: absolute
