name: Scene or evaluation problem
description: Report a scene, seed, instruction or evaluator problem
title: "[scene] <scene name>"
labels: ["scene-problem"]
body:
  - type: input
    id: scene
    attributes: {label: Scene name}
    validations: {required: true}
  - type: input
    id: commit
    attributes: {label: Repository commit}
    validations: {required: true}
  - type: input
    id: policy
    attributes: {label: Policy or agent key}
  - type: textarea
    id: observed
    attributes:
      label: What happened
      description: Include `_run_metadata.json` and the relevant lines of `suite/logs/<run>/<scene>.log`. Do not paste seed values or credentials.
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: What the protocol says should happen}
